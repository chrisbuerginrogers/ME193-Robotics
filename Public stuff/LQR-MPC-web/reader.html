<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes · LQR &amp; MPC</title>
<style>
  :root {
    --bg: #f5f6f8; --panel-bg: #ffffff; --fg: #1b1e24; --muted: #5b6270;
    --grid: #e2e4e9; --border: #d8dbe1; --accent: #2563eb; --ok: #157a3d; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel-bg: #1c1f26; --fg: #e7e9ee; --muted: #9aa2b1;
      --grid: #333844; --border: #333844; --accent: #6ea8fe; --ok: #4fd17a; --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.6; }
  .site-nav { display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--panel-bg); }
  .site-nav a { color: var(--muted); text-decoration: none; font-size: 13px;
    padding: 6px 10px; border-radius: 6px; }
  .site-nav a:hover { background: var(--grid); color: var(--fg); }
  .site-nav a.active { background: var(--accent); color: #fff; }
  .site-nav a.robot-btn { margin-left: auto; background: var(--ok); color: #fff; font-weight: 600; }
  .site-nav .fallback-note { flex-basis: 100%; font-size: 11.5px; color: var(--muted); }
  main.doc { max-width: 78ch; margin: 0 auto; padding: 28px 20px 60px 20px; }
  main.doc h1, main.doc h2, main.doc h3 { line-height: 1.25; }
  main.doc h1 { font-size: 26px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  main.doc h2 { font-size: 20px; margin-top: 2.2em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  main.doc h3 { font-size: 16px; margin-top: 1.8em; }
  main.doc a { color: var(--accent); }
  main.doc code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em;
    background: var(--grid); padding: 0.15em 0.4em; border-radius: 4px; }
  main.doc pre { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; }
  main.doc pre code { background: none; padding: 0; }
  main.doc blockquote { border-left: 3px solid var(--accent); margin: 1.2em 0; padding: 4px 16px;
    background: var(--panel-bg); border-radius: 0 6px 6px 0; color: var(--muted); }
  main.doc table { border-collapse: collapse; width: 100%; margin: 1.2em 0; font-size: 14px;
    display: block; overflow-x: auto; }
  main.doc th, main.doc td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  main.doc th { background: var(--panel-bg); }
  main.doc hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  main.doc img { max-width: 100%; border-radius: 8px; }
  .banner { background: #fff3cd; color: #664d03; border: 1px solid #ffe69c;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 20px; }
  @media (prefers-color-scheme: dark) {
    .banner { background: #3a2f10; color: #ffd97a; border-color: #5c4a10; }
  }
  .pyrun { border: 1px solid var(--border); border-left: 4px solid var(--ok); border-radius: 8px;
    background: var(--panel-bg); padding: 10px 14px; margin: 1.2em 0; }
  .pyrun-head { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .pyrun-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pyrun-row input { flex: 1; min-width: 8em; max-width: 22em; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    font: 0.9em ui-monospace, Menlo, monospace; }
  .pyrun-row button { background: var(--ok); color: #fff; border: none; border-radius: 7px; padding: 6px 14px;
    font: inherit; font-size: 13px; cursor: pointer; }
  .pyrun-row button:disabled { opacity: .55; cursor: default; }
  .pyrun-out { margin: 10px 0 0; max-height: 28em; overflow: auto; font-size: 12px; line-height: 1.45;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
</style>
<script>
  window.MathJax = {
    tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
</head>
<body>
<div class="site-nav" id="site-nav"></div>
<main class="doc" id="doc-main"><p>Loading…</p></main>
<script>
"use strict";
/* Renders the course notes (Markdown + TeX) in the browser: marked.js for the
   Markdown, MathJax for the maths. $...$ is pulled out before marked sees it so
   underscores inside formulas survive. All paths are relative to this page, so
   it works from any folder, including a github.io project site. */
const NOTES = [
  ["notes/README.md", "Home"],
  ["notes/00-sim.md", "00 · sim.py"],
  ["notes/01-lqr.md", "01 · LQR"],
  ["notes/02-mpc.md", "02 · MPC"],
  ["notes/03-lqr-vs-mpc.md", "03 · LQR vs MPC"],
];
const ROOT = decodeURI(new URL(".", location.href).pathname);

function renderNav(active) {
  const links = NOTES.map(([h, t]) =>
    `<a href="reader.html?src=${encodeURIComponent(h)}"${h === active ? ' class="active"' : ""}>${t}</a>`);
  links.push('<a href="interactive.html">Interactive</a>');
  links.push('<a href="interactive.html#robot" class="robot-btn">\u{1F50C} Connect to robot</a>');
  document.getElementById("site-nav").innerHTML = links.join("\n");
}
function extractMath(md) {
  const store = [];
  let out = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => { store.push(`\\[${t}\\]`); return `@@MATH${store.length - 1}@@`; });
  out = out.replace(/\$((?:[^\$\n]|\n(?!\n))+?)\$/g, (_, t) => { store.push(`\\(${t}\\)`); return `@@MATH${store.length - 1}@@`; });
  return { text: out, store };
}
const restoreMath = (html, store) => html.replace(/@@MATH(\d+)@@/g, (_, i) => store[Number(i)]);
const slugify = raw => raw.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s/g, "-");
function makeRenderer() {
  const r = new marked.Renderer(), seen = {};
  r.heading = (text, level, raw) => {
    let slug = slugify(raw);
    if (seen[slug] !== undefined) { seen[slug]++; slug += "-" + seen[slug]; } else seen[slug] = 0;
    return `<h${level} id="${slug}">${text}</h${level}>\n`;
  };
  return r;
}
function rewriteMdLinks(container, baseURL) {
  container.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^https?:\/\//i.test(href) || !/\.md(#.*)?$/i.test(href)) return;
    const t = new URL(href, baseURL);
    const rel = decodeURI(t.pathname).slice(ROOT.length);
    a.href = `reader.html?src=${encodeURIComponent(rel)}${t.hash}`;
  });
}

/* -- "Run it here" boxes: <div class="pyrun" data-run="sim|bangbang|pd|lqr|mpc" ...> in the Markdown.
      PyScript is only loaded on pages that have one. docs_runs.py wires up the buttons. -- */
function buildRunBoxes(container) {
  const boxes = container.querySelectorAll(".pyrun");
  boxes.forEach(box => {
    const script = box.dataset.script || "code/sim.py";
    const args = box.dataset.args;
    const sec = box.dataset.section;
    const cmd = `python3 ${script}`;
    box.innerHTML =
      `<div class="pyrun-head"><b>Run it here, in your browser.</b> Prints what <code>${cmd}</code> prints` +
      (sec && sec !== "all" ? ` (section ${sec} of its report)` : "") + `.</div>` +
      `<div class="pyrun-row"><code>${cmd}</code>` +
      (args !== undefined ? `<input value="${args}" spellcheck="false" aria-label="arguments for ${script}">` : "") +
      `<button disabled>Loading Python…</button></div><pre class="pyrun-out" style="display:none"></pre>`;
  });
  if (!boxes.length) return;
  const css = document.createElement("link");
  css.rel = "stylesheet"; css.href = "https://pyscript.net/releases/2024.1.1/core.css";
  document.head.appendChild(css);
  const core = document.createElement("script");
  core.type = "module"; core.src = "https://pyscript.net/releases/2024.1.1/core.js";
  document.head.appendChild(core);
  const py = document.createElement("script");
  py.type = "py"; py.src = "./docs_runs.py"; py.setAttribute("config", "./docs.toml");
  document.body.appendChild(py);
}

async function main() {
  const src = new URLSearchParams(location.search).get("src") || "notes/README.md";
  renderNav(src);
  const hit = NOTES.find(([h]) => h === src);
  document.title = (hit ? hit[1] : src) + " · LQR & MPC";
  const box = document.getElementById("doc-main");
  let md;
  try {
    const res = await fetch(src);
    if (!res.ok) throw new Error("HTTP " + res.status);
    md = await res.text();
  } catch (err) {
    box.innerHTML = `<div class="banner">Could not load <code>${src}</code> (${err.message}). ` +
      `Serve the folder over HTTP (<code>python3 -m http.server</code>) instead of opening the file directly.</div>`;
    return;
  }
  const { text, store } = extractMath(md);
  box.innerHTML = restoreMath(marked.parse(text, { renderer: makeRenderer(), gfm: true }), store);
  rewriteMdLinks(box, new URL(src, location.href));
  buildRunBoxes(box);
  if (window.MathJax && MathJax.typesetPromise) await MathJax.typesetPromise([box]);
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
}
main();
</script>
</body>
</html>
